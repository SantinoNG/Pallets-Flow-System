<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Pallets Flow - Diseño Natural">
  <defs>
    <!-- Arcos REALES (medio circulo), para que el texto curve bien -->
    <path id="arcoSuperior" d="M 26 104 A 74 74 0 0 1 174 104" fill="none"/>
    <path id="arcoInferior" d="M 30 108 A 74 74 0 0 0 170 108" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#F3E7CE"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#4A3728" stroke-width="4"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#4A3728" stroke-width="2.5"/>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="2" fill="#4A3728">
    <textPath xlink:href="#arcoSuperior" href="#arcoSuperior" startOffset="50%" text-anchor="middle">PALLETS FLOW</textPath>
  </text>

  <g stroke="#4A3728" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pallet de dibujo lineal -->
    <path d="M 56 108 L 144 108"/>
    <path d="M 56 122 L 144 122"/>
    <path d="M 64 122 L 64 146"/>
    <path d="M 100 122 L 100 146"/>
    <path d="M 136 122 L 136 146"/>
    <path d="M 56 108 L 56 96"/>
    <path d="M 144 108 L 144 96"/>
  </g>

  <!-- Planta brotando del pallet -->
  <g stroke="#6B8E4E" stroke-width="4.5" fill="none" stroke-linecap="round">
    <path d="M 100 96 Q 100 74 100 62"/>
    <path d="M 100 76 Q 84 66 74 54"/>
    <path d="M 100 68 Q 116 58 126 46"/>
  </g>
  <g fill="#8FB56B">
    <ellipse cx="72" cy="50" rx="11" ry="6" transform="rotate(-32 72 50)"/>
    <ellipse cx="128" cy="42" rx="11" ry="6" transform="rotate(32 128 42)"/>
  </g>
  <ellipse cx="100" cy="58" rx="10" ry="12" fill="#7C9E5C"/>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="1.2" fill="#4A3728">
    <textPath xlink:href="#arcoInferior" href="#arcoInferior" startOffset="50%" text-anchor="middle">DISEÑO NATURAL</textPath>
  </text>
</svg>